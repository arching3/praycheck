# 버전 태그(v1.0.2 등)가 push되면: 테스트 → 배포 zip 빌드·검사 → GitHub Release 등록(최신으로 표시)
# 사용자 앱의 [업데이트]는 이 Release(releases/latest)의 praycheck_v<버전>.zip을 내려받는다.
# 태그는 로컬에서 scripts/publish.py가 붙이고, push는 관리자가 직접 한다.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # Release 만들기

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest   # 사용자 환경과 같은 Windows(맑은 고딕 글꼴로 PDF 테스트)
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PRAYER_TRACKER_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 구성 요소 설치(배포본과 같은 고정 버전)
        run: |
          python -m pip install --disable-pip-version-check -r requirements-runtime.txt "pytest>=8.0"

      - name: 테스트
        run: python -m pytest -q -p no:cacheprovider

      - name: 배포 zip 빌드·검사
        id: build
        run: python scripts/ci_release.py "${{ github.ref_name }}"

      - name: Release 등록
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.build.outputs.asset }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "${{ steps.build.outputs.body }}" \
            --latest
